<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenkins Plugin Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1rem 4rem;
    }

    .container { width: 100%; max-width: 720px; }

    header { margin-bottom: 1.75rem; }
    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    header p  { margin-top: 0.35rem; color: #555; font-size: 0.9rem; line-height: 1.5; }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 1.75rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .row { display: flex; gap: 0.85rem; flex-wrap: wrap; }

    .field { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 120px; margin-bottom: 1rem; }
    .field label { font-size: 0.78rem; font-weight: 600; color: #444; text-transform: uppercase; letter-spacing: 0.05em; }

    input[type="text"] {
      padding: 0.55rem 0.8rem;
      border: 1.5px solid #dde1e9;
      border-radius: 7px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      background: #fafafa;
      width: 100%;
    }
    input[type="text"]:focus { border-color: #3b6ef0; background: #fff; }
    input[type="text"]::placeholder { color: #aaa; }

    .opt-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
      color: #555;
    }
    .opt-row input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #3b6ef0; }
    .opt-row label { cursor: pointer; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary { background: #3b6ef0; color: #fff; }
    .btn-primary:hover { background: #2a5bd7; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-success { background: #16a34a; color: #fff; text-decoration: none; }
    .btn-success:hover { background: #15803d; }

    /* Progress */
    #progress-section { display: none; margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1.25rem; }

    .section-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .badge-running { background: #fef9c3; color: #854d0e; }
    .badge-done    { background: #dcfce7; color: #166534; }
    .badge-error   { background: #fee2e2; color: #991b1b; }

    .log {
      background: #1a1b26;
      color: #cdd6f4;
      font-family: "Cascadia Code", "JetBrains Mono", "Fira Code", "Consolas", monospace;
      font-size: 0.78rem;
      line-height: 1.65;
      border-radius: 7px;
      padding: 0.9rem 1rem;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Plugin summary table */
    #summary-section { display: none; margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1.25rem; }

    .table-wrap { overflow-x: auto; margin-top: 0.55rem; border-radius: 7px; border: 1px solid #e5e7eb; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    thead th {
      background: #f8f9fb;
      text-align: left;
      padding: 0.55rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      border-bottom: 1px solid #e5e7eb;
    }
    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    tbody td { padding: 0.5rem 0.85rem; color: #333; }
    tbody td.mono { font-family: monospace; font-size: 0.82rem; }
    tbody td.right { text-align: right; color: #666; }

    #download-wrap { margin-top: 1.1rem; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Jenkins Plugin Downloader</h1>
    <p>Download a plugin and its full dependency tree for air-gapped installation.</p>
  </header>

  <div class="card">
    <div class="row">
      <div class="field" style="flex:2; min-width:180px;">
        <label for="plugin_name">Plugin name</label>
        <input type="text" id="plugin_name" placeholder="e.g. git, http_request" autocomplete="off" autofocus>
      </div>
      <div class="field" style="max-width:130px;">
        <label for="version">Plugin version</label>
        <input type="text" id="version" placeholder="latest" value="latest">
      </div>
      <div class="field" style="max-width:155px;">
        <label for="jenkins_version">Jenkins version <span style="font-weight:400;color:#888;">(optional)</span></label>
        <input type="text" id="jenkins_version" placeholder="e.g. 2.440.3">
      </div>
    </div>

    <div class="opt-row">
      <input type="checkbox" id="include_optional">
      <label for="include_optional">Include optional dependencies</label>
    </div>

    <button class="btn btn-primary" id="start-btn" onclick="startDownload()">Download plugins</button>

    <!-- Progress log -->
    <div id="progress-section">
      <div class="section-label">
        Progress
        <span id="badge" class="badge"></span>
      </div>
      <div class="log" id="log"></div>
    </div>

    <!-- Plugin summary table -->
    <div id="summary-section">
      <div class="section-label">
        Downloaded plugins
        <span id="plugin-count" style="font-weight:400; color:#666; font-size:0.8rem;"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Plugin</th>
              <th>Version</th>
              <th style="text-align:right;">Size</th>
            </tr>
          </thead>
          <tbody id="plugin-tbody"></tbody>
        </table>
      </div>
      <div id="download-wrap">
        <a id="download-link" class="btn btn-success" href="#" style="margin-top:1rem; display:inline-flex;">
          Download ZIP
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  let pollTimer = null;

  function colorize(lines) {
    return lines.map(l => {
      const e = esc(l);
      if (l.startsWith("  ✓"))   return `<span style="color:#a6e3a1">${e}</span>`;
      if (l.startsWith("  ✗"))   return `<span style="color:#f38ba8">${e}</span>`;
      if (l.startsWith("  ⚠"))   return `<span style="color:#f9e2af">${e}</span>`;
      if (l.startsWith("  –"))   return `<span style="color:#6c7086">${e}</span>`;
      if (l.startsWith("FATAL")) return `<span style="color:#f38ba8">${e}</span>`;
      if (l.startsWith("Done"))  return `<span style="color:#a6e3a1">${e}</span>`;
      return e;
    }).join("\n");
  }

  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function formatSize(kb) {
    if (kb >= 1024) return (kb / 1024).toFixed(1) + " MB";
    return kb + " KB";
  }

  async function startDownload() {
    const name    = document.getElementById("plugin_name").value.trim();
    const version = document.getElementById("version").value.trim() || "latest";
    const jv      = document.getElementById("jenkins_version").value.trim();
    const inclOpt = document.getElementById("include_optional").checked;

    if (!name) { alert("Please enter a plugin name."); return; }

    document.getElementById("start-btn").disabled = true;
    document.getElementById("progress-section").style.display = "block";
    document.getElementById("summary-section").style.display = "none";
    document.getElementById("log").innerHTML = "";
    document.getElementById("plugin-tbody").innerHTML = "";
    setBadge("running");

    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

    let resp;
    try {
      resp = await fetch("/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ plugin_name: name, version, jenkins_version: jv || null, include_optional: inclOpt })
      });
    } catch (e) {
      appendRaw(`Network error: ${e}`);
      setBadge("error");
      document.getElementById("start-btn").disabled = false;
      return;
    }

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      appendRaw("Error: " + (err.error || resp.statusText));
      setBadge("error");
      document.getElementById("start-btn").disabled = false;
      return;
    }

    const { job_id } = await resp.json();
    poll(job_id);
  }

  function poll(jobId) {
    pollTimer = setInterval(async () => {
      try {
        const resp = await fetch(`/status/${jobId}`);
        const data = await resp.json();

        const logEl = document.getElementById("log");
        logEl.innerHTML = colorize(data.log);
        logEl.scrollTop = logEl.scrollHeight;

        if (data.status === "done") {
          clearInterval(pollTimer);
          setBadge("done");
          showPluginTable(data.plugins, jobId);
          document.getElementById("start-btn").disabled = false;
        } else if (data.status === "error") {
          clearInterval(pollTimer);
          setBadge("error");
          document.getElementById("start-btn").disabled = false;
        }
      } catch (_) { /* transient glitch, keep polling */ }
    }, 600);
  }

  function showPluginTable(plugins, jobId) {
    const tbody = document.getElementById("plugin-tbody");
    tbody.innerHTML = "";
    plugins.forEach((p, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="color:#999;width:36px">${i + 1}</td>
        <td class="mono">${esc(p.name)}</td>
        <td class="mono">${esc(p.version)}</td>
        <td class="right">${formatSize(p.size_kb)}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("plugin-count").textContent = `${plugins.length} plugin${plugins.length !== 1 ? "s" : ""}`;
    document.getElementById("download-link").href = `/result/${jobId}`;
    document.getElementById("summary-section").style.display = "block";
  }

  function appendRaw(msg) {
    document.getElementById("log").textContent += msg + "\n";
  }

  function setBadge(state) {
    const b = document.getElementById("badge");
    b.className = `badge badge-${state}`;
    b.textContent = state === "running" ? "Running…" : state === "done" ? "Complete" : "Error";
  }
</script>
</body>
</html>
